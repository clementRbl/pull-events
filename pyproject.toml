[project]
name = "pull-events"
version = "1.1.0"
description = "Chatbot RAG d'événements culturels en Île-de-France"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "langchain>=0.3",
    "langchain-mistralai>=1.1.6",
    "langchain-postgres>=0.0.19",
    "langfuse>=5.0.4",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn>=0.54.0",
]

[tool.ruff]
# Version Python cible
target-version = "py310"

# Longueur maximale des lignes
line-length = 88

# Dossiers exclus de l'analyse
exclude = [
    "env",
    "venv",
    ".venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Règles activées :
# E/W = style pycodestyle, F = pyflakes, I = isort (tri des imports),
# UP = pyupgrade, S = sécurité (bandit), B = bugbear
select = ["E", "W", "F", "I", "UP", "S", "B"]

# Règles ignorées :
# S101 = usage de assert (utile dans les tests)
ignore = ["S101"]

# Correction automatique activée pour toutes les règles fixables
fixable = ["ALL"]

[tool.ruff.lint.isort]
# Imports du projet reconnus comme first-party
known-first-party = ["scripts"]

[tool.ruff.format]
# Style de guillemets : double
quote-style = "double"

# Indentation : espaces
indent-style = "space"

[dependency-groups]
dev = [
    "faiss-cpu>=1.15.1",
    "httpx>=0.28.1",
    "langchain-anthropic>=1.7.6",
    # ragas 0.4.3 importe chat_models.vertexai, supprimé dans langchain-community 0.4.2
    "langchain-community>=0.4,<0.4.2",
    "pytest>=9.1.1",
    "ragas>=0.4.3",
    "ruff>=0.17.2",
]
