apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pull-events.name" . }}
  labels:
    {{- include "pull-events.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "pull-events.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "pull-events.selectorLabels" . | nindent 8 }}
      annotations:
        # Redémarre les pods quand la configuration change
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: {{ include "pull-events.name" . }}-config
            - secretRef:
                name: {{ .Values.secrets.name }}
          # L'API ne charge la chaîne RAG qu'à la première question : /health
          # répond vite, donc des délais courts suffisent.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          {{- if eq .Values.secrets.source "keyvault" }}
          # Le montage déclenche la lecture du Key Vault et la synchronisation
          # vers le Secret Kubernetes lu par envFrom.
          volumeMounts:
            - name: keyvault
              mountPath: /mnt/secrets
              readOnly: true
          {{- end }}
      {{- if eq .Values.secrets.source "keyvault" }}
      volumes:
        - name: keyvault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: {{ include "pull-events.name" . }}-keyvault
      {{- end }}
