{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "pull-events.name" . }}
  labels:
    {{- include "pull-events.labels" . | nindent 4 }}
  {{- if .Values.ingress.tls.enabled }}
  annotations:
    # cert-manager demande et renouvelle le certificat pour ce nom d'hôte
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "pull-events.name" . }}
                port:
                  name: http
{{- end }}
