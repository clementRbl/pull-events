{{- if eq .Values.secrets.source "keyvault" }}
# Pilote CSI Secrets Store (add-on AKS) : lit les secrets dans Key Vault avec
# l'identité managée de l'add-on et les recopie dans un Secret Kubernetes.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "pull-events.name" . }}-keyvault
  labels:
    {{- include "pull-events.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    keyvaultName: {{ .Values.secrets.keyVault.name }}
    tenantId: {{ .Values.secrets.keyVault.tenantId | quote }}
    useVMManagedIdentity: "true"
    userAssignedIdentityID: {{ .Values.secrets.keyVault.clientId | quote }}
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
        - |
          objectName: api-key
          objectType: secret
        - |
          objectName: azure-openai-api-key
          objectType: secret
        - |
          objectName: langfuse-public-key
          objectType: secret
        - |
          objectName: langfuse-secret-key
          objectType: secret
  secretObjects:
    - secretName: {{ .Values.secrets.name }}
      type: Opaque
      data:
        - objectName: database-url
          key: DATABASE_URL
        - objectName: api-key
          key: API_KEY
        - objectName: azure-openai-api-key
          key: AZURE_OPENAI_API_KEY
        - objectName: langfuse-public-key
          key: LANGFUSE_PUBLIC_KEY
        - objectName: langfuse-secret-key
          key: LANGFUSE_SECRET_KEY
{{- end }}
