apiVersion: v1
kind: Service
metadata:
  name: {{ include "pull-events.name" . }}
  labels:
    {{- include "pull-events.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "pull-events.selectorLabels" . | nindent 4 }}
